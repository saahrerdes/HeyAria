<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ária AI</title>

<link rel="stylesheet" href="style.css">

<style>

/* (SEU CSS ORIGINAL MANTIDO) */

.audio-wrapper{
display:flex;
align-items:center;
gap:10px;
margin-top:6px;
}

.audio-bar{
flex:1;
height:6px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
}

.audio-progress{
height:100%;
width:0%;
background:#2563eb;
}

.time{
font-size:11px;
color:#6b7280;
min-width:40px;
text-align:right;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR (SEM ALTERAÇÃO) -->
<div class="sidebar">
<div class="logo">
<img src="/images/aria.png" class="logo-avatar">
<span>Ária</span>
</div>

<div class="plan-box">
<div id="planName">Plano Free</div>
<div id="usageBox"></div>
<button onclick="upgradePro()" class="pro-btn">
💎 Tornar-se PRO
</button>
</div>

<div class="side-section">
<h3>Modo</h3>

<button class="side-btn active" onclick="setMode(event,'teacher')">
👩‍🏫 Professora
</button>

<button class="side-btn" onclick="setMode(event,'casual')">
💬 Casual
</button>
</div>

<div class="side-section">
<h3>Ferramentas</h3>

<button class="side-btn" onclick="deepMode()">
🔎 Investigar a fundo
</button>

<button class="side-btn" onclick="toggleErrors()">
📚 Dicionário de erros
</button>

<button class="side-btn" onclick="newChat()">
🆕 Nova conversa
</button>
</div>
</div>

<!-- CHAT -->
<div class="chat">

<div class="chat-header">
<img src="/images/aria.png" class="avatar" id="avatar">

<div class="chat-info">
<div class="name">Ária</div>
<div class="status" id="status">IA professora poliglota</div>
</div>
</div>

<div class="messages" id="messages"></div>
<div class="typing" id="typing">Ária está digitando...</div>

<div class="input-area">

<button id="uploadBtn" class="tool-btn">📎</button>

<input type="text" id="textInput" placeholder="Fale com a Ária...">

<button id="micBtn" class="mic-btn">🎤</button>

<button id="sendBtn" class="send-btn">Enviar</button>

</div>

<input type="file" id="fileInput" hidden>
</div>
</div>

<!-- ERROS -->
<div id="errorsPanel" class="errors-panel hidden">
<h3>Dicionário de erros</h3>
<div id="errorsList"></div>
</div>

</body>
</html>
<script>

let mode = "teacher"
let plan = "free"

let currentAudio = null

let usage = {
messages: 0,
audio: 0
}

const limits = {
free: { messages: 20, audio: 10 },
pro: { messages: 9999, audio: 9999 }
}

const messages = document.getElementById("messages")
const input = document.getElementById("textInput")
const avatar = document.getElementById("avatar")
const typing = document.getElementById("typing")

/* =========================
USER ID
========================= */
function getOrCreateUserId() {
let id = localStorage.getItem("aria_user")
if (!id) {
id = crypto.randomUUID()
localStorage.setItem("aria_user", id)
}
return id
}

/* =========================
MODE
========================= */
function setMode(event, m) {
mode = m

document.querySelectorAll(".side-btn")
.forEach(b => b.classList.remove("active"))

event.target.classList.add("active")

document.getElementById("status").innerText =
mode === "teacher"
? "Modo professora ativa"
: "Modo conversa natural"
}

/* =========================
AUDIO PLAYER (WHATSAPP STYLE)
========================= */
function createAudioBubble(url, type) {

const wrapper = document.createElement("div")
wrapper.className = "msg " + type

const container = document.createElement("div")
container.className = "audio-wrapper"

const btn = document.createElement("button")
btn.className = "audio-btn"
btn.innerText = "▶"

const bar = document.createElement("div")
bar.className = "audio-bar"

const progress = document.createElement("div")
progress.className = "audio-progress"

bar.appendChild(progress)

const time = document.createElement("div")
time.className = "time"
time.innerText = "0:00"

const audio = new Audio(url)
audio.preload = "auto"

let playing = false

btn.onclick = async () => {

if (currentAudio && currentAudio !== audio) {
currentAudio.pause()
}

if (!playing) {
await audio.play()
btn.innerText = "⏸"
currentAudio = audio
} else {
audio.pause()
btn.innerText = "▶"
currentAudio = null
}

playing = !playing
}

/* progresso */
audio.ontimeupdate = () => {
const percent = (audio.currentTime / audio.duration) * 100
progress.style.width = percent + "%"

const min = Math.floor(audio.currentTime / 60)
const sec = Math.floor(audio.currentTime % 60)
time.innerText = `${min}:${sec.toString().padStart(2,"0")}`
}

audio.onended = () => {
btn.innerText = "▶"
progress.style.width = "0%"
playing = false
currentAudio = null
}

container.appendChild(btn)
container.appendChild(bar)
container.appendChild(time)

wrapper.appendChild(container)

messages.appendChild(wrapper)
messages.scrollTop = messages.scrollHeight

return audio
}

/* =========================
MESSAGES
========================= */
function addMsg(text, type) {
const div = document.createElement("div")
div.className = "msg " + type

let html = text
.replace(/\*\*(.*?)\*\*/g, '<span class="error-word">$1</span>')
.replace(/([^\n]+?:)/g, '<strong>$1</strong>')
.replace(/\n/g, '<br>')

div.innerHTML = html

messages.appendChild(div)
messages.scrollTop = messages.scrollHeight
}

/* =========================
SPEAK (ÁRIA)
========================= */
async function speak(text) {

usage.audio++
updateUsage()

const res = await fetch("/speak", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ text })
})

const blob = await res.blob()
const url = URL.createObjectURL(blob)

/* cria player */
const audio = createAudioBubble(url, "bot")

/* autoplay seguro */
try {
await audio.play()
avatar.classList.add("speaking")
} catch (e) {
console.log("Autoplay bloqueado")
}

/* parar animação */
audio.onended = () => {
avatar.classList.remove("speaking")
}

}

/* =========================
SEND
========================= */
document.getElementById("sendBtn").onclick = send

input.addEventListener("keypress", e => {
if (e.key === "Enter") send()
})

async function send() {

if (usage.messages >= limits[plan].messages) {
alert("Limite FREE atingido")
return
}

const text = input.value
if (!text) return

addMsg(text, "user")

input.value = ""

usage.messages++
updateUsage()

typing.style.display = "block"

const res = await fetch("/chat", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
message: text,
userId: getOrCreateUserId()
})
})

const data = await res.json()

typing.style.display = "none"

addMsg(data.reply, "bot")

await speak(data.reply)

}

/* =========================
MIC (GRAVAÇÃO REAL)
========================= */
let recorder
let chunks = []
let recording = false

document.getElementById("micBtn").onclick = async () => {

if (usage.audio >= limits[plan].audio) {
alert("Limite áudio FREE")
return
}

if (!recording) {

/* START */
const stream = await navigator.mediaDevices.getUserMedia({ audio: true })

recorder = new MediaRecorder(stream)
recorder.start()

chunks = []
recording = true

recorder.ondataavailable = e => chunks.push(e.data)

} else {

/* STOP */
recorder.stop()
recording = false

recorder.onstop = async () => {

usage.audio++
updateUsage()

const blob = new Blob(chunks, { type: "audio/webm" })

const form = new FormData()
form.append("audio", blob, "audio.webm")
form.append("userId", getOrCreateUserId())

typing.style.display = "block"

const res = await fetch("/api/audio-eval", {
method: "POST",
body: form
})

const data = await res.json()

typing.style.display = "none"

/* áudio usuário */
createAudioBubble(data.audioUrl, "user")

/* resposta */
addMsg(data.reply, "bot")

/* fala aria */
await speak(data.reply)

}

}

}

/* =========================
UPLOAD
========================= */
document.getElementById("uploadBtn").onclick = () => {
document.getElementById("fileInput").click()
}

/* =========================
UTILS
========================= */
function toggleErrors() {
document.getElementById("errorsPanel").classList.toggle("hidden")
}

function newChat() {
messages.innerHTML = ""
}

function deepMode() {
addMsg("Modo investigar ativado", "bot")
}

function updateUsage() {
document.getElementById("usageBox").innerHTML =
`
Mensagens: ${usage.messages}/${limits[plan].messages}<br>
Áudio: ${usage.audio}/${limits[plan].audio}
`
}

async function upgradePro() {
const res = await fetch("/create-checkout-session", { method: "POST" })
const data = await res.json()
window.location.href = data.url
}

updateUsage()

</script>
